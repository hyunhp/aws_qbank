<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:#F3F5F8;margin:0;padding:16px}
.item{max-width:520px;margin:0 auto 24px}
.item h2{font-size:.9rem;margin:0 0 4px}
.issues{color:#C6473F;font-size:.8rem;white-space:pre-line}
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
// Serve the repo root over HTTP and open /tools/diagrams/preview.html (optionally ?only=Q000457,Q001025).
const root = "../../";
const m = await (await fetch(root + "diagrams/index.json", { cache: "no-cache" })).json();
const mod = await import(root + "js/diagram.js?v=" + m.version);
const only = new URLSearchParams(location.search).get("only");
const ids = only ? only.split(",") : m.ids;
const out = document.getElementById("out");
const results = {};

function inter(a, b, pad = 0) {
  return a.x < b.x + b.width - pad && b.x < a.x + a.width - pad && a.y < b.y + b.height - pad && b.y < a.y + a.height - pad;
}
function lint(svg) {
  const issues = [];
  const vb = svg.viewBox.baseVal;
  const texts = [...svg.querySelectorAll(".qb-node-label, .qb-group-label, .qb-edge-label text")].map(t => ({ t, b: t.getBBox(), owner: t.closest(".qb-node, .qb-edge-label") || t }));
  // 1. anything outside the canvas
  for (const e of svg.querySelectorAll(".qb-group, .qb-node, .qb-edge, .qb-edge-label, .qb-group-label")) {
    const b = e.getBBox();
    if (b.x < -1 || b.y < -1 || b.x + b.width > vb.width + 1 || b.y + b.height > vb.height + 1) issues.push(`outside canvas: ${e.getAttribute("class")} ${e.dataset.id || e.textContent || ""}`);
  }
  // 2. overlapping texts from different owners
  for (let i = 0; i < texts.length; i++) for (let j = i + 1; j < texts.length; j++) {
    if (texts[i].owner !== texts[j].owner && inter(texts[i].b, texts[j].b, 1)) issues.push(`text overlap: "${texts[i].t.textContent}" / "${texts[j].t.textContent}"`);
  }
  // 3. edge labels covering icons
  const icons = [...svg.querySelectorAll(".qb-node use")].map(u => ({ id: u.parentNode.dataset.id, b: u.getBBox() }));
  for (const lab of svg.querySelectorAll(".qb-edge-label rect")) {
    const b = lab.getBBox();
    for (const ic of icons) if (inter(b, ic.b, 1)) issues.push(`edge label over icon ${ic.id}`);
  }
  // 4. edges passing through icons (other than own endpoints) or group titles
  const groupTitles = [...svg.querySelectorAll(".qb-group-label")].map(t => ({ name: t.textContent, b: t.getBBox() }));
  for (const p of svg.querySelectorAll(".qb-edge")) {
    const len = p.getTotalLength();
    const hit = new Set();
    for (let s = 0; s <= len; s += 3) {
      const q = p.getPointAtLength(s);
      for (const ic of icons) {
        if (ic.id === p.dataset.from || ic.id === p.dataset.to) continue;
        const b = ic.b;
        if (q.x > b.x + 2 && q.x < b.x + b.width - 2 && q.y > b.y + 2 && q.y < b.y + b.height - 2) hit.add(`crosses icon ${ic.id}`);
      }
      for (const gt of groupTitles) {
        const b = gt.b;
        if (q.x > b.x - 4 && q.x < b.x + b.width + 4 && q.y > b.y - 2 && q.y < b.y + b.height + 2) hit.add(`crosses group title "${gt.name}"`);
      }
    }
    for (const h of hit) issues.push(`edge ${p.dataset.from}->${p.dataset.to} ${h}`);
  }
  // 5. node label spilling out of the innermost group that contains its icon centre
  const groups = [...svg.querySelectorAll(".qb-group")].map(r => ({ id: r.dataset.id, b: r.getBBox() }));
  for (const n of svg.querySelectorAll(".qb-node")) {
    const ic = n.querySelector("use").getBBox();
    const cx = ic.x + ic.width / 2, cy = ic.y + ic.height / 2;
    const inside = groups.filter(g => cx > g.b.x && cx < g.b.x + g.b.width && cy > g.b.y && cy < g.b.y + g.b.height);
    const nb = n.getBBox();
    for (const g of inside) if (nb.x < g.b.x || nb.x + nb.width > g.b.x + g.b.width || nb.y + nb.height > g.b.y + g.b.height) issues.push(`node ${n.dataset.id} spills out of group ${g.id}`);
  }
  // 6. icons straddling a group border
  for (const ic of icons) {
    for (const g of groups) {
      const a = ic.b, b = g.b;
      const overlaps = inter(a, b, 0);
      const inside = a.x >= b.x && a.x + a.width <= b.x + b.width && a.y >= b.y && a.y + a.height <= b.y + b.height;
      if (overlaps && !inside) issues.push(`icon ${ic.id} straddles group ${g.id} border`);
    }
  }
  return [...new Set(issues)];
}

for (const id of ids) {
  const item = document.createElement("div");
  item.className = "item"; item.id = "item-" + id;
  item.innerHTML = `<h2>${id}</h2>`;
  out.appendChild(item);
  try {
    const spec = await (await fetch(`${root}diagrams/${id}.json?v=${m.version}`)).json();
    const fig = await mod.renderDiagram(spec, item, { spriteUrl: `${root}assets/aws-icons.svg?v=${m.version}`, zoom: false });
    results[id] = lint(fig.querySelector("svg"));
  } catch (e) {
    results[id] = ["render error: " + e.message];
  }
  if (results[id].length) {
    const d = document.createElement("div"); d.className = "issues"; d.textContent = results[id].join("\n"); item.appendChild(d);
  }
}
window.__lint = results;
</script>
</body>
</html>
